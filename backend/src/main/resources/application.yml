server:
  # 仅监听回环地址：本机浏览器访问，不对局域网或公网开放。
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

spring:
  config:
    import: optional:file:./local-secret/development.properties
  application:
    name: szpu-algohub
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/algohub
    username: algohub
    password: algohub_local_dev
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # Map 结果也保留值为 null 的列，前端据此区分“无数据”与“字段缺失”
    call-setters-on-nulls: true
    default-fetch-size: 200

logging:
  level:
    root: info
    com.szpu.algohub: info

algohub:
  security:
    # 留空则首次启动生成密钥文件；更换密钥会使所有登录状态失效
    jwt-secret: ""
    jwt-secret-file: ./local-secret/jwt-key.txt
    access-token-minutes: 30
    refresh-token-days: 14
    max-sessions-per-user: 10
    max-login-failures: 8
    login-lock-minutes: 15
  oauth:
    github:
      # 在 GitHub → Settings → Developer settings → OAuth Apps 创建后填写；留空表示不启用
      client-id: ""
      client-secret: ""
      # 必须与 GitHub OAuth App 登记的回调地址一致
      redirect-uri: "http://127.0.0.1:5174/oauth/github/callback"
  bootstrap:
    admin-username: admin
    admin-password: admin12345
    admin-display-name: 本地管理员
  credential:
    # 留空则首次启动时生成密钥文件，与数据库分开保存。
    master-key: ""
    key-file: ./local-secret/credential-key.txt
  sync:
    enabled: true
    worker-threads: 2
    poll-interval-ms: 5000
    # 任务租约（秒）：执行中每 1/4 租约续租一次；进程退出后租约过期即可被接管
    lease-seconds: 120
    # 同一平台同时执行的任务数上限
    per-platform-concurrency: 1
    active-account-interval-minutes: 45
    idle-account-interval-minutes: 720
    active-window-days: 14
    contest-interval-minutes: 45
    # 独立于个人提交的题目评级更新：CF、AtCoder Problems、牛客竞赛题库；0 关闭
    catalog-interval-minutes: 1440
    recheck-days: 3
  # 码蹄集昵称索引：后台每 10 分钟补全的排行榜页数（每页 50 人，受平台共享限速约束）；0 表示不在后台补全
  matiji-index:
    pages-per-run: 10
  http:
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    user-agent: "SZPU-AlgoHub/0.1 (local study tracker)"
    # 平台共享限速：CF 官方文档要求调用间隔不少于 2 秒，AtCoder Problems 要求超过 1 秒。
    min-interval-ms:
      CODEFORCES: 2100
      ATCODER: 1500
      LUOGU: 3000
      LEETCODE_CN: 2000
      NOWCODER: 3000
      HDU: 3000
      QOJ: 3000
      MATIJI: 2500
      LANQIAO: 2000
  # 会让后端请求外站的用户入口统一限频（查询 / 验证平台账号、添加个人关注、保存或试用登录态、
  # 牛客 Tracker 实时读取、码蹄集实时翻页）：窗口内按本站用户、按来源 IP 各自计数
  outbound-guard:
    per-user: 30
    # 校园出口 IP 后面有很多同学，比单人宽得多
    per-ip: 300
    window-minutes: 10
  accounts:
    # 每个用户在每个平台最多几个账号（正式绑定、待认领、个人关注都算）
    max-per-platform: 3
