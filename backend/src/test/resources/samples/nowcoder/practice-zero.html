<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>sample_user的比赛主页</title></head><body>
<div class="my-state-box">
<div class="my-state-item" style="width:310px;">
<div class="state-num">0</div>
<span>题已挑战</span>
</div>
<div class="my-state-item" style="width:310px;">
<div class="state-num">0</div>
<span>题已通过</span>
</div>
<div class="my-state-item" style="width:310px;">
<div class="state-num">0</div>
<span>次提交</span>
</div>
</div>
<table class="table-hover">
<thead>
<tr>
<th width="150">运行ID</th>
<th width="250">题目</th>
<th class="simple-dropdown" data-type="statusTypeFilter" width="100">
<div class="btn-group">
<button class="btn btn-default dropdown-toggle">运行结果<span class="caret"></span></button>
</div>
</th>
<th width="100">得分</th>
<th data-by="time" width="100">运行时间(ms)</th>
<th data-by="memory" width="100">使用内存(KB)</th>
<th data-by="length" width="100">代码长度</th>
<th class="simple-dropdown" data-type="languageCategoryFilter" width="100">
<div class="btn-group">
<button class="btn btn-default dropdown-toggle">使用语言<span class="caret"></span></button>
</div>
</th>
<th data-by="submitTime" width="250">提交时间
                        <div class="rank-oprt">
<a class="rank-up js-rank" data-type="ASC" href="javascript:void(0);"></a>
<a class="rank-down js-rank" data-type="DESC" href="javascript:void(0);"></a>
</div>
</th>
</tr>
</thead>
<tbody>
<tr><td colspan="1024">
<div class="platform-mod-bd js-list">
<div style="padding:20px 0;font-size:14px;text-align:center;">
<div class="empty-tip-mod">
<p>没有找到你想要的内容呢￣□￣｜｜</p>
</div>
</div>
</div>
</td></tr>
</tbody>
</table>

</body></html>
