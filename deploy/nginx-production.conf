# 替换 algohub.top 和证书路径；安装到 /etc/nginx/conf.d/algohub.conf。
limit_req_zone $binary_remote_addr zone=algohub_api:10m rate=20r/s;
server {
    listen 80;
    server_name algohub.top www.algohub.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / { return 301 https://algohub.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name algohub.top;
    ssl_certificate /etc/letsencrypt/live/algohub.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algohub.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/algohub/frontend;
    index index.html;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # 只加载本站的脚本和接口；平台头像来自各 OJ 的图床，图片放行 https。
    # style 要 unsafe-inline：Vue 的 :style 和图表库写的是行内样式。改这行后浏览器控制台看有没有被拦的资源。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 注意：location 里一旦写 add_header，上面这些都不会继承，要在那个 location 里重写一遍。
    # 查询串可能携带 OAuth code/state；使用不记录查询串的访问日志格式。
    access_log /var/log/algohub/algohub-access.log algohub_safe;
    error_log /var/log/algohub/algohub-error.log warn;
    location = /admin/login { return 302 https://admin.algohub.top/; }
    location = /admin { return 302 https://admin.algohub.top/; }
    location ^~ /admin/ { return 302 https://admin.algohub.top/; }
    location = /api/auth/login { return 404; }
    location ^~ /internal/ { return 404; }
    location ~ /\. { deny all; }
    location /api/ {
        limit_req zone=algohub_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖而非追加客户端提交的代理头；仅适用于 Nginx 直接面向客户端。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /assets/ { try_files $uri =404; expires 30d; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}

# 登录 Cookie 与 OAuth state 使用统一的网站入口；保留旧标签页及洛谷脚本的 API/资源访问。
server {
    listen 443 ssl;
    server_name www.algohub.top;
    ssl_certificate /etc/letsencrypt/live/algohub.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algohub.top/privkey.pem;
